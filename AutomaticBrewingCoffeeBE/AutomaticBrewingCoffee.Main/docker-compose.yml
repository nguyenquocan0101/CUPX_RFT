services:
  
  jaeger:
    image: jaegertracing/all-in-one:1.54
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"    # Jaeger UI
  
  otel-collector:
    image: otel/opentelemetry-collector:0.95.0
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - jaeger

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      ACCEPT_EULA: "Y"
    ports:
      # 1433 is commonly occupied by a local SQL Server on Windows.
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-11433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
    container_name: abc-system
    restart: unless-stopped
    ports:
      # Keep the origin private; Cloudflare Tunnel reaches it over the Docker network.
      - "127.0.0.1:${API_HOST_PORT:-30475}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Server=sqlserver;Database=AutoBrewing_BE;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=True;
      Redis__ConnectionString: redis:6379,abortConnect=false
      Redis__DatabaseCache: redis:6379
      JWT__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Supabase__Url: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      Supabase__Key: ${SUPABASE_KEY:?Set SUPABASE_KEY in .env}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      WebApp__Domain: ${WEBAPP_DOMAIN:?Set WEBAPP_DOMAIN in .env}
      VNPay__CallbackUrl: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env}/api/v1/orders/vnpay-system/payment-callback
      VNPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPay__TmnCode: ${VNPAY_TMN_CODE:?Set VNPAY_TMN_CODE in .env}
      VNPay__HashSecret: ${VNPAY_HASH_SECRET:?Set VNPAY_HASH_SECRET in .env}
      Cloudflare__BaseUrl: https://api.cloudflare.com/client/v4/
      Cloudflare__DefaultServer: http://api:8080
      OpenTelemetry__OltpCollectorUrl: otel-collector:4317
      OpenTelemetry__ServiceName: AutoBrew.Server.Apis
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    container_name: abc-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      - api

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
